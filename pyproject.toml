[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goddard-rl"
version = "0.1.0"
description = "Reproduction and improvement of CARL Section 7 on the constrained Goddard rocket"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PyYAML",
    "pandas",
    "torch",
    "numba",
]

[project.optional-dependencies]
casadi = ["casadi"]
dev = ["pytest", "ruff", "jupyter", "ipykernel"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length is enforced by the formatter, not every docstring
  "RUF001", # ambiguous unicode in prose (μ, ×, – appear in docstrings)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
